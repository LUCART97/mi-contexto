name: OpenClaw IA Vertyx

on:
  schedule:
    - cron: "23 12 * * 1-6"   # 8:23am Caracas (UTC-4), lunes a sábado
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  openclaw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Corre OpenClaw (memoria + herramienta + log)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MEM0_API_KEY: ${{ secrets.MEM0_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: node scripts/openclaw.mjs

      - name: Commit log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "IA Vertyx Bot"
          git config user.email "bot@iavertyx.local"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add memory/log.md
          git diff --quiet --cached || git commit -m "OpenClaw run $(date +%F)"
          git push
